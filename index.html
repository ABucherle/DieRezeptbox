<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Die Rezeptbox</title>

  <!--
    ============================================================
    EINRICHTUNG (einmalig) — siehe Anleitung im Chat für Details
    ============================================================
    1. Auf https://console.firebase.google.com ein kostenloses Projekt anlegen.
    2. Im Projekt: "Firestore Database" aktivieren (im Produktionsmodus).
    3. Im Projekt: "Authentication" aktivieren -> Anmelde-Methode "Google" einschalten.
    4. Unter Projekteinstellungen -> "Meine Apps" -> Web-App hinzufügen.
       Dort bekommst du ein Konfigurationsobjekt — das unten bei
       "firebaseConfig" einfügen (ersetzt die Platzhalter).
    5. In Firestore unter "Regeln" die Sicherheitsregeln einfügen,
       die im Chat bereitgestellt wurden.
    ============================================================
  -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --ink: #2B2620;
      --paper: #F6EFDE;
      --paper-2: #EFE4CB;
      --white: #FFFDF8;
      --wine: #7A2E33;
      --wine-dark: #55202A;
      --rust: #B5502D;
      --butter: #E8B23D;
      --line: #C9BFA8;
    }

    .rb-root * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    .rb-root {
      font-family: 'Work Sans', sans-serif;
      color: var(--ink);
      background: var(--paper);
      min-height: 100vh;
      padding: 0 0 100px 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    .rb-fab, .rb-close, .rb-small-btn, .rb-save-btn, .rb-source-btn, .rb-time-chip, .rb-cat-chip, .rb-heart, .rb-stepper button, .rb-ing-remove, .rb-filter-btn, .rb-active-chip, .rb-edit-btn, .rb-google-btn, .rb-signout-btn {
      -webkit-user-select: none;
      user-select: none;
    }

    .rb-topbar { padding: 28px 20px 14px 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .rb-title {
      font-family: 'Fraunces', serif;
      font-optical-sizing: auto;
      font-weight: 700;
      font-size: 34px;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .rb-subtitle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--wine-dark);
      margin: 4px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .rb-user-chip { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 4px; }
    .rb-user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); background: var(--paper-2); }
    .rb-user-avatar-fallback { width: 32px; height: 32px; border-radius: 50%; background: var(--wine); color: var(--paper); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
    .rb-signout-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--wine-dark); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 4px 0; }

    .rb-filter-bar { display: flex; align-items: center; gap: 12px; padding: 0 20px; margin-top: 18px; }
    .rb-filter-btn { 
      font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; 
      padding: 8px 16px; border-radius: 20px; border: 1px solid var(--line); 
      background: var(--white); color: var(--ink); cursor: pointer; 
      display: flex; align-items: center; gap: 6px; flex-shrink: 0; 
      box-shadow: 0 1px 2px rgba(43,38,32,0.05); transition: all 0.15s ease;
    }
    .rb-filter-btn:active { transform: scale(0.96); }
    .rb-filter-btn.active { background: var(--wine); color: var(--paper); border-color: var(--wine); }
    
    .rb-active-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .rb-active-chips::-webkit-scrollbar { display: none; }
    .rb-active-chip { 
      font-family: 'IBM Plex Mono', monospace; font-size: 12px; 
      padding: 6px 12px 6px 14px; border-radius: 16px; background: var(--paper-2); 
      color: var(--ink); white-space: nowrap; display: flex; align-items: center; 
      gap: 6px; border: 1px solid var(--line); cursor: pointer; 
    }
    .rb-active-chip span { color: var(--rust); font-size: 14px; font-weight: bold; line-height: 1; margin-top: -1px; }

    .rb-gallery { padding: 18px 20px 0 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    @media (min-width: 640px) { .rb-gallery { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .rb-gallery { grid-template-columns: repeat(4, 1fr); } }

    .rb-card { background: var(--white); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; box-shadow: 0 1px 0 rgba(43,38,32,0.05); }
    .rb-card-tab { height: 6px; width: 100%; }
    .rb-card-photo-wrap { padding: 10px 10px 0 10px; position: relative; }
    .rb-card-photo { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 2px; border: 4px solid var(--white); outline: 1px solid var(--line); transform: rotate(-1deg); display: block; background: var(--paper-2); }
    .rb-card-photo-empty { width: 100%; aspect-ratio: 1/1; border-radius: 2px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; color: var(--line); font-family: 'IBM Plex Mono', monospace; font-size: 24px; background: var(--paper); }
    .rb-card-body { padding: 10px 12px 12px 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .rb-card-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; line-height: 1.2; margin: 0; }
    .rb-card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .rb-chip { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--paper-2); color: var(--wine-dark); white-space: nowrap; }
    .rb-chip-time { background: var(--butter); color: var(--ink); }
    .rb-chip-author { background: var(--wine); color: var(--paper); }

    .rb-heart { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,253,248,0.9); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; z-index: 2; color: var(--ink); }
    .rb-heart.liked { color: var(--rust); border-color: var(--rust); }
    .rb-heart-detail { font-size: 20px; }

    .rb-empty { margin: 40px 20px; text-align: center; padding: 40px 20px; border: 1px dashed var(--line); border-radius: 6px; }
    .rb-empty-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; margin: 0 0 6px 0; }
    .rb-empty-sub { font-size: 14px; color: var(--wine-dark); margin: 0; }

    .rb-fab { position: fixed; right: 36px; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; background: var(--rust); color: var(--paper); border: none; font-size: 28px; line-height: 1; box-shadow: 0 4px 14px rgba(181,80,45,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 40; }
    .rb-fab:active { transform: scale(0.94); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .rb-overlay { position: fixed; inset: 0; background: rgba(20,17,13,0.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s ease-out forwards; }
    .rb-sheet { background: var(--white); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px; box-shadow: 0 -8px 40px rgba(20,17,13,0.35); border-top: 1px solid var(--line); overscroll-behavior-y: contain; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    @media (min-width: 640px) { .rb-overlay { align-items: center; } .rb-sheet { border-radius: 12px; max-height: 88vh; border: 1px solid var(--line); } }
    .rb-sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .rb-sheet-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 20px; margin: 0; }
    
    .rb-close { background: none; border: none; font-size: 20px; color: var(--ink); cursor: pointer; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; }

    .rb-field { margin-bottom: 16px; }
    .rb-label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--wine-dark); margin-bottom: 6px; }
    
    .rb-input, .rb-textarea, select.rb-input {
      width: 100%; border: 1px solid var(--line); background: var(--white); border-radius: 6px; padding: 10px 12px;
      font-family: 'Work Sans', sans-serif; font-size: 16px; color: var(--ink);
    }
    .rb-textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
    .rb-input:focus, .rb-textarea:focus { outline: 2px solid var(--wine); outline-offset: 1px; }

    .rb-source-row, .rb-cat-row, .rb-time-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .rb-source-btn, .rb-time-chip { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 7px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--white); cursor: pointer; color: var(--ink); }
    .rb-source-btn.active, .rb-time-chip.active { background: var(--wine); border-color: var(--wine); color: var(--paper); }

    .rb-cat-chip { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--white); cursor: pointer; color: var(--ink); transition: background 0.15s; }
    .rb-cat-chip.selected { background: var(--butter); border-color: var(--butter); color: var(--ink); font-weight: 500; }
    .rb-cat-add-row { display: flex; gap: 6px; }
    .rb-cat-add-row .rb-input { flex: 1; }
    .rb-small-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--white); cursor: pointer; color: var(--ink); }

    .rb-photo-well { width: 100%; aspect-ratio: 16/9; border: 1px dashed var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--wine-dark); font-family: 'IBM Plex Mono', monospace; font-size: 13px; cursor: pointer; overflow: hidden; background: var(--white); }
    .rb-photo-well img { width: 100%; height: 100%; object-fit: cover; }

    .rb-scan-btn { width: 100%; padding: 13px; border: 1px dashed var(--wine); border-radius: 8px; background: var(--paper-2); color: var(--wine-dark); font-family: 'IBM Plex Mono', monospace; font-size: 13px; cursor: pointer; margin-bottom: 6px; text-align: center; }
    .rb-scan-btn:disabled { opacity: 0.6; cursor: default; }
    .rb-scan-status { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--wine-dark); margin: 0 0 16px 0; }
    .rb-scan-error { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--rust); margin: 0 0 16px 0; }

    .rb-ing-row { display: grid; grid-template-columns: 74px 90px 1fr 44px; gap: 6px; margin-bottom: 6px; align-items: center; }
    .rb-ing-remove { background: none; border: none; color: var(--rust); font-size: 24px; line-height: 1; cursor: pointer; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; }
    .rb-ing-add-btn { margin-top: 2px; }

    .rb-servings-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .rb-stepper { display: flex; align-items: center; gap: 10px; }
    .rb-stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--white); font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); padding: 0;}
    .rb-stepper .rb-stepper-val { font-family: 'IBM Plex Mono', monospace; font-size: 16px; min-width: 24px; text-align: center; }

    .rb-ing-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    .rb-ing-table th { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--wine-dark); text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
    .rb-ing-table td { padding: 7px 6px; border-bottom: 1px solid var(--line); font-size: 15px; }
    .rb-ing-table td:first-child { font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }

    .rb-save-btn, .rb-edit-btn { width: 100%; padding: 13px; border-radius: 8px; border: none; background: var(--wine); color: var(--paper); font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 6px; }
    .rb-edit-btn { background: var(--butter); color: var(--ink); margin-top: 32px; margin-bottom: 8px; }
    .rb-save-btn:disabled { opacity: 0.5; cursor: default; }
    .rb-error { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--rust); margin-top: -8px; margin-bottom: 12px; }

    .rb-detail-photo-wrap { position: relative; margin-bottom: 16px; }
    .rb-detail-photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; display: block; background: var(--paper-2); }
    .rb-detail-name-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .rb-detail-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px; margin: 0 0 6px 0; }
    .rb-detail-source { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--wine-dark); margin-bottom: 4px; }
    .rb-detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .rb-detail-section-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--wine-dark); margin: 18px 0 8px 0; border-top: 1px solid var(--line); padding-top: 14px; }
    .rb-detail-instructions { font-size: 16px; line-height: 1.65; white-space: pre-wrap; }
    .rb-delete-btn { width: 100%; background: none; border: none; color: var(--rust); font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 10px 14px; border-radius: 6px; cursor: pointer; text-align: center; }

    .rb-loading, .rb-status { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--wine-dark); padding: 40px 20px; }

    /* Login screen */
    .rb-login { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; gap: 8px; }
    .rb-login-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 32px; margin: 0; }
    .rb-login-sub { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--wine-dark); margin: 0 0 28px 0; max-width: 320px; line-height: 1.6; }
    .rb-google-btn {
      display: flex; align-items: center; gap: 10px; background: var(--white); color: var(--ink);
      border: 1px solid var(--line); border-radius: 8px; padding: 13px 22px; font-family: 'Work Sans', sans-serif;
      font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 1px 3px rgba(43,38,32,0.08);
    }
    .rb-google-btn:active { transform: scale(0.97); }
    .rb-login-error { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--rust); margin-top: 18px; max-width: 320px; }
    .rb-login-note { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--line); margin-top: 40px; max-width: 300px; line-height: 1.6; }

    @media (prefers-reduced-motion: reduce) { .rb-fab, .rb-sheet, .rb-overlay { transition: none; animation: none; } }
  </style>
</head>
<body>

  <div class="rb-root" id="rbRoot">
    <div id="rbApp"><div class="rb-loading">Wird geladen…</div></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, where
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ============================================================
    // HIER DEINE FIREBASE-KONFIGURATION EINFÜGEN
    // (Firebase-Konsole -> Projekteinstellungen -> Meine Apps -> Web-App)
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAG-y8pAAa9hHbYbBxbNd5--LdQ6y7VxFY",
      authDomain: "rezeptbox-59e41.firebaseapp.com",
      projectId: "rezeptbox-59e41",
      storageBucket: "rezeptbox-59e41.firebasestorage.app",
      messagingSenderId: "735417717313",
      appId: "1:735417717313:web:f1d0fea894dd0c1a92ecc0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const SOURCE_TYPES = [
      { key: 'cookbook', label: 'Kochbuch', placeholder: 'Buchtitel & Seite' },
      { key: 'instagram', label: 'Instagram', placeholder: '@Handle oder Link' },
      { key: 'website', label: 'Website', placeholder: 'URL' },
      { key: 'friend', label: 'Freund/Familie', placeholder: 'Von wem' },
      { key: 'other', label: 'Sonstiges', placeholder: 'Woher es stammt' }
    ];
    const SUGGESTED_CATEGORIES = ['Vegetarisch','Vegan','Schnell & Einfach','Comfort Food','Dessert','Frühstück','Wochentags-Dinner','Scharf','Gesund','Backen','Date Night','Meal Prep'];
    const UNITS = ['g','kg','ml','l','TL','EL','Tasse','Stk.','Prise','oz','lb','Zehe','Scheibe','Dose','Bund','sonst.'];
    const TIME_PRESETS = ['15 Min.','30 Min.','45 Min.','1 Std.','1,5 Std.','2 Std.+'];
    const TAB_COLORS = ['var(--wine)', 'var(--rust)', 'var(--butter)'];

    const state = {
      authLoading: true, user: null, authError: null,
      recipesRaw: [], favoriteIds: new Set(), recipesLoaded: false, favesLoaded: false,
      error: null, activeFilters: new Set(), showFavoritesOnly: false,
      overlay: null, addDraft: null, detailServings: null
    };
    let unsubRecipes = null, unsubFaves = null;

    function tabColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      return TAB_COLORS[Math.abs(hash) % TAB_COLORS.length];
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function newId() { return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }
    function fmtAmt(n) {
      if (n === null || n === undefined || isNaN(n)) return '';
      const r = Math.round(n * 100) / 100;
      return String(r).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
    }
    function matchUnit(u) {
      if (!u) return 'g';
      const found = UNITS.find(x => x.toLowerCase() === String(u).toLowerCase());
      return found || 'sonst.';
    }
    function initials(name) {
      if (!name) return '?';
      return name.trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
    }

    // ---------- Auth ----------
    onAuthStateChanged(auth, (user) => {
      state.authLoading = false;
      state.user = user;
      if (user) { subscribeToData(user); }
      else { teardownSubscriptions(); resetLocalState(); }
      render();
    });

    function resetLocalState() {
      state.recipesRaw = []; state.favoriteIds = new Set();
      state.recipesLoaded = false; state.favesLoaded = false;
      state.activeFilters = new Set(); state.showFavoritesOnly = false;
      state.overlay = null; state.addDraft = null;
    }
    function teardownSubscriptions() {
      if (unsubRecipes) { unsubRecipes(); unsubRecipes = null; }
      if (unsubFaves) { unsubFaves(); unsubFaves = null; }
    }

    async function doSignIn() {
      state.authError = null; render();
      try { await signInWithPopup(auth, provider); }
      catch (e) { state.authError = 'Anmeldung fehlgeschlagen. Bitte erneut versuchen.'; render(); }
    }
    async function doSignOut() {
      teardownSubscriptions();
      await signOut(auth);
    }

    // ---------- Firestore subscriptions ----------
    function subscribeToData(user) {
      teardownSubscriptions();
      state.error = null;

      unsubRecipes = onSnapshot(
        collection(db, 'recipes'),
        (snap) => {
          state.recipesRaw = snap.docs.map(d => d.data());
          state.recipesLoaded = true;
          render();
        },
        (err) => { state.error = 'Rezepte konnten nicht geladen werden. Prüfe deine Verbindung.'; render(); }
      );

      const favQuery = query(collection(db, 'favorites'), where('uid', '==', user.uid));
      unsubFaves = onSnapshot(
        favQuery,
        (snap) => {
          const ids = new Set();
          snap.docs.forEach(d => { if (d.data().liked) ids.add(d.data().recipeId); });
          state.favoriteIds = ids;
          state.favesLoaded = true;
          render();
        },
        (err) => { state.favesLoaded = true; render(); }
      );
    }

    function getMeals() {
      return state.recipesRaw
        .map(m => Object.assign({}, m, { liked: state.favoriteIds.has(m.id) }))
        .sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0));
    }

    async function saveRecipe(entry) {
      await setDoc(doc(db, 'recipes', entry.id), entry);
    }
    async function deleteRecipe(id) {
      await deleteDoc(doc(db, 'recipes', id));
    }
    async function toggleLike(id) {
      const liked = !state.favoriteIds.has(id);
      // optimistic UI update
      if (liked) state.favoriteIds.add(id); else state.favoriteIds.delete(id);
      render();
      try {
        await setDoc(doc(db, 'favorites', state.user.uid + '_' + id), {
          uid: state.user.uid, recipeId: id, liked
        });
      } catch (e) {
        if (liked) state.favoriteIds.delete(id); else state.favoriteIds.add(id);
        render();
      }
    }

    function allCategories() {
      const set = new Set();
      state.recipesRaw.forEach(m => (m.categories || []).forEach(c => set.add(c)));
      return Array.from(set).sort();
    }

    function filteredMeals() {
      let list = getMeals();
      if (state.showFavoritesOnly) list = list.filter(m => m.liked);
      if (state.activeFilters.size > 0) {
        list = list.filter(m => {
          const cats = new Set(m.categories || []);
          for (const f of state.activeFilters) if (!cats.has(f)) return false;
          return true;
        });
      }
      return list;
    }

    // ---------- Render root ----------
    function render() {
      const host = document.getElementById('rbApp');
      if (state.authLoading) { host.innerHTML = '<div class="rb-loading">Wird geladen…</div>'; return; }
      if (!state.user) { renderLogin(host); return; }
      renderAppShell(host);
    }

    function renderLogin(host) {
      host.innerHTML = `
        <div class="rb-login">
          <p class="rb-login-title">Die Rezeptbox</p>
          <p class="rb-login-sub">Euer gemeinsames Verzeichnis unvergesslicher Gerichte. Meldet euch beide mit Google an, um eure Rezepte zu teilen.</p>
          <button class="rb-google-btn" id="rbSignInBtn">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5c-7.7 0-14.4 4.3-17.7 10.6z"/><path fill="#4CAF50" d="M24 43.5c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5c-2 1.5-4.6 2.4-7.6 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.1 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.5C41.5 36 43.5 30.5 43.5 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
            Mit Google anmelden
          </button>
          ${state.authError ? `<p class="rb-login-error">${escapeHtml(state.authError)}</p>` : ''}
          <p class="rb-login-note">Nur wer diesen Link kennt und sich anmeldet, kann die Rezepte sehen und bearbeiten.</p>
        </div>`;
      document.getElementById('rbSignInBtn').addEventListener('click', doSignIn);
    }

    function renderAppShell(host) {
      host.innerHTML = `
        <div class="rb-topbar">
          <div>
            <p class="rb-title">Die Rezeptbox</p>
            <p class="rb-subtitle">ein gemeinsames Verzeichnis unvergesslicher Gerichte</p>
          </div>
          <div class="rb-user-chip">
            ${state.user.photoURL
              ? `<img class="rb-user-avatar" src="${state.user.photoURL}" alt="">`
              : `<div class="rb-user-avatar-fallback">${escapeHtml(initials(state.user.displayName || state.user.email))}</div>`}
          </div>
        </div>
        <div style="padding:0 20px; margin-top:-10px; margin-bottom:4px; text-align:right;">
          <button class="rb-signout-btn" id="rbSignOutBtn">Abmelden</button>
        </div>
        <div id="rbFilterWrap"></div>
        <div id="rbBody"></div>
        <button class="rb-fab" id="rbFab" aria-label="Gericht hinzufügen">+</button>
      `;
      document.getElementById('rbSignOutBtn').addEventListener('click', doSignOut);
      document.getElementById('rbFab').addEventListener('click', () => {
        state.addDraft = { id: null, name: '', instructions: '', sourceType: 'cookbook', sourceDetail: '', categories: [], prepTime: '', servings: 4, ingredients: [{ amount: '', unit: 'g', name: '' }], photo: null, saving: false, error: null, scanning: false, scanError: null, scanSuccess: false };
        state.overlay = 'add';
        renderOverlay();
      });

      renderFilterBar();
      renderBody();
      renderOverlay();
    }

    function renderFilterBar() {
      const wrap = document.getElementById('rbFilterWrap');
      if (!wrap) return;
      const cats = allCategories();
      if (!state.recipesLoaded) { wrap.innerHTML = ''; return; }
      if (cats.length === 0 && state.recipesRaw.length === 0) { wrap.innerHTML = ''; return; }

      const activeCount = state.activeFilters.size + (state.showFavoritesOnly ? 1 : 0);
      let activeChipsHtml = '';
      if (state.showFavoritesOnly) {
        activeChipsHtml += `<div class="rb-active-chip" data-remove="__fav__">♥ Favoriten <span>×</span></div>`;
      }
      state.activeFilters.forEach(f => {
        activeChipsHtml += `<div class="rb-active-chip" data-remove="${escapeHtml(f)}">${escapeHtml(f)} <span>×</span></div>`;
      });

      wrap.innerHTML = `
        <div class="rb-filter-bar">
          <button class="rb-filter-btn ${activeCount > 0 ? 'active' : ''}" id="rbOpenFilterBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
            Filter ${activeCount > 0 ? `(${activeCount})` : ''}
          </button>
          <div class="rb-active-chips">${activeChipsHtml}</div>
        </div>
      `;

      document.getElementById('rbOpenFilterBtn').addEventListener('click', () => { state.overlay = 'filter'; renderOverlay(); });
      wrap.querySelectorAll('.rb-active-chip').forEach(el => {
        el.addEventListener('click', () => {
          const tab = el.getAttribute('data-remove');
          if (tab === '__fav__') state.showFavoritesOnly = false;
          else state.activeFilters.delete(tab);
          renderFilterBar(); renderBody();
        });
      });
    }

    function renderBody() {
      const body = document.getElementById('rbBody');
      if (!body) return;
      if (state.error) { body.innerHTML = `<div class="rb-status">${escapeHtml(state.error)}</div>`; return; }
      if (!state.recipesLoaded || !state.favesLoaded) { body.innerHTML = '<div class="rb-loading">Box wird geöffnet…</div>'; return; }

      const meals = filteredMeals();
      if (state.recipesRaw.length === 0) {
        body.innerHTML = `<div class="rb-empty"><p class="rb-empty-title">Noch keine Rezepte</p><p class="rb-empty-sub">Füg dein erstes unvergessliches Gericht hinzu.</p></div>`;
        return;
      }
      if (meals.length === 0) {
        body.innerHTML = `<div class="rb-empty"><p class="rb-empty-title">Keine Treffer</p><p class="rb-empty-sub">Ändere deine Filtereinstellungen, um Gerichte zu finden.</p></div>`;
        return;
      }
      body.innerHTML = `<div class="rb-gallery">${meals.map(cardHtml).join('')}</div>`;
      body.querySelectorAll('.rb-card').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-id');
          const m = getMeals().find(x => x.id === id);
          state.detailServings = m ? (m.servings || 4) : 4;
          state.overlay = { type: 'detail', id };
          renderOverlay();
        });
      });
      body.querySelectorAll('[data-heart]').forEach(el => {
        el.addEventListener('click', e => { e.stopPropagation(); toggleLike(el.getAttribute('data-heart')); });
      });
    }

    function cardHtml(m) {
      const color = tabColor((m.categories && m.categories[0]) || m.name || 'x');
      const photo = m.photo ? `<img class="rb-card-photo" src="${m.photo}" alt="">` : `<div class="rb-card-photo-empty">🍽</div>`;
      const catChips = (m.categories || []).slice(0, 2).map(c => `<span class="rb-chip">${escapeHtml(c)}</span>`).join('');
      const timeChip = m.prepTime ? `<span class="rb-chip rb-chip-time">⏱ ${escapeHtml(m.prepTime)}</span>` : '';
      return `
        <div class="rb-card" data-id="${m.id}">
          <div class="rb-card-tab" style="background:${color}"></div>
          <div class="rb-card-photo-wrap">
            ${photo}
            <button class="rb-heart ${m.liked ? 'liked' : ''}" data-heart="${m.id}">${m.liked ? '♥' : '♡'}</button>
          </div>
          <div class="rb-card-body">
            <p class="rb-card-name">${escapeHtml(m.name)}</p>
            <div class="rb-card-tags">${timeChip}${catChips}</div>
          </div>
        </div>`;
    }

    function renderOverlay() {
      const existing = document.getElementById('rbOverlay');
      if (existing) existing.remove();
      if (!state.overlay) return;
      const host = document.getElementById('rbRoot');
      const wrap = document.createElement('div');
      if (state.overlay === 'add') { wrap.innerHTML = addSheetHtml(); host.appendChild(wrap.firstElementChild); bindAddSheet(); return; }
      if (state.overlay === 'filter') { wrap.innerHTML = filterSheetHtml(); host.appendChild(wrap.firstElementChild); bindFilterSheet(); return; }
      if (state.overlay.type === 'detail') { wrap.innerHTML = detailSheetHtml(state.overlay.id); host.appendChild(wrap.firstElementChild); bindDetailSheet(state.overlay.id); return; }
    }

    function closeOverlay() { state.overlay = null; state.addDraft = null; renderOverlay(); }

    function filterSheetHtml() {
      const cats = allCategories();
      return `
        <div class="rb-overlay" id="rbOverlay">
          <div class="rb-sheet">
            <div class="rb-sheet-head">
              <p class="rb-sheet-title">Rezepte filtern</p>
              <button class="rb-close" id="rbFilterClose">✕</button>
            </div>
            <div class="rb-field">
              <label class="rb-label">Besondere</label>
              <div class="rb-cat-row">
                <div class="rb-cat-chip ${state.showFavoritesOnly ? 'selected' : ''}" id="rbFilterFav">♥ Nur Favoriten</div>
              </div>
            </div>
            <div class="rb-field">
              <label class="rb-label">Tags & Kategorien (Mehrfachauswahl)</label>
              <div class="rb-cat-row">
                ${cats.length === 0 ? '<p class="rb-empty-sub">Es wurden noch keine Tags vergeben.</p>' : ''}
                ${cats.map(c => `<div class="rb-cat-chip tag-filter-chip ${state.activeFilters.has(c) ? 'selected' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join('')}
              </div>
            </div>
            <button class="rb-save-btn" id="rbFilterClear" style="background: var(--paper-2); color: var(--wine-dark); border: 1px solid var(--line); margin-top: 24px;">Alle Filter zurücksetzen</button>
            <button class="rb-save-btn" id="rbFilterApply" style="margin-top: 8px;">Ergebnisse anzeigen</button>
          </div>
        </div>
      `;
    }

    function bindFilterSheet() {
      document.getElementById('rbOverlay').addEventListener('click', e => { if (e.target.id === 'rbOverlay') closeOverlay(); });
      document.getElementById('rbFilterClose').addEventListener('click', closeOverlay);
      document.getElementById('rbFilterApply').addEventListener('click', closeOverlay);
      document.getElementById('rbFilterFav').addEventListener('click', () => {
        state.showFavoritesOnly = !state.showFavoritesOnly;
        renderOverlay();
      });
      document.querySelectorAll('.tag-filter-chip').forEach(el => {
        el.addEventListener('click', () => {
          const c = el.getAttribute('data-cat');
          if (state.activeFilters.has(c)) state.activeFilters.delete(c);
          else state.activeFilters.add(c);
          renderOverlay();
        });
      });
      document.getElementById('rbFilterClear').addEventListener('click', () => {
        state.showFavoritesOnly = false;
        state.activeFilters.clear();
        closeOverlay();
        renderFilterBar(); renderBody();
      });
      document.getElementById('rbFilterApply').addEventListener('click', () => { renderFilterBar(); renderBody(); });
    }

    function detailSheetHtml(id) {
      const m = getMeals().find(x => x.id === id);
      if (!m) return '<div></div>';
      const sourceLabel = (SOURCE_TYPES.find(s => s.key === m.sourceType) || {}).label || 'Sonstiges';
      const sourceLine = m.sourceDetail ? `${sourceLabel} — ${escapeHtml(m.sourceDetail)}` : sourceLabel;
      const photo = m.photo ? `<div class="rb-detail-photo-wrap"><img class="rb-detail-photo" src="${m.photo}" alt=""><button class="rb-heart rb-heart-detail ${m.liked ? 'liked' : ''}" data-heart="${m.id}">${m.liked ? '♥' : '♡'}</button></div>` : '';
      const tags = (m.categories || []).map(c => `<span class="rb-chip">${escapeHtml(c)}</span>`).join('');
      const timeChip = m.prepTime ? `<span class="rb-chip rb-chip-time">⏱ ${escapeHtml(m.prepTime)}</span>` : '';
      const baseServings = (m.servings && m.servings > 0) ? m.servings : 1;
      const curServings = state.detailServings || baseServings;
      const scale = curServings / baseServings;
      const rows = (m.ingredients || []).map(ing => `
        <tr>
          <td>${ing.amount !== '' && ing.amount !== null && ing.amount !== undefined ? fmtAmt(Number(ing.amount) * scale) : ''}</td>
          <td>${escapeHtml(ing.unit || '')}</td>
          <td>${escapeHtml(ing.name || '')}</td>
        </tr>`).join('');
      return `
        <div class="rb-overlay" id="rbOverlay">
          <div class="rb-sheet">
            <div class="rb-sheet-head">
              <p class="rb-sheet-title">&nbsp;</p>
              <button class="rb-close" id="rbDetailClose">✕</button>
            </div>
            ${photo}
            <div class="rb-detail-name-row">
              <p class="rb-detail-name">${escapeHtml(m.name)}</p>
              ${!m.photo ? `<button class="rb-heart rb-heart-detail ${m.liked ? 'liked' : ''}" data-heart="${m.id}" style="position:static;">${m.liked ? '♥' : '♡'}</button>` : ''}
            </div>
            <p class="rb-detail-source">${sourceLine}</p>
            <div class="rb-detail-tags">${timeChip}${tags}</div>

            <div class="rb-detail-section-label">Portionen</div>
            <div class="rb-servings-row">
              <div class="rb-stepper">
                <button id="rbServMinus">−</button>
                <span class="rb-stepper-val" id="rbServVal">${curServings}</span>
                <button id="rbServPlus">+</button>
              </div>
            </div>

            <div class="rb-detail-section-label">Zutaten</div>
            <table class="rb-ing-table">
              <thead><tr><th>Menge</th><th>Einheit</th><th>Zutat</th></tr></thead>
              <tbody>${rows || '<tr><td colspan="3">—</td></tr>'}</tbody>
            </table>

            <div class="rb-detail-section-label">Zubereitung</div>
            <div class="rb-detail-instructions">${escapeHtml(m.instructions || '')}</div>

            <button class="rb-edit-btn" id="rbEditBtn">Rezept bearbeiten</button>
            <button class="rb-delete-btn" id="rbDeleteBtn">Dieses Rezept löschen</button>
          </div>
        </div>`;
    }

    function bindDetailSheet(id) {
      document.getElementById('rbOverlay').addEventListener('click', e => { if (e.target.id === 'rbOverlay') closeOverlay(); });
      document.getElementById('rbDetailClose').addEventListener('click', closeOverlay);

      document.getElementById('rbDeleteBtn').addEventListener('click', async () => {
        if (!confirm('Dieses Rezept endgültig löschen? Es verschwindet für euch beide.')) return;
        try { await deleteRecipe(id); closeOverlay(); }
        catch (e) { alert('Löschen fehlgeschlagen. Bitte erneut versuchen.'); }
      });

      document.getElementById('rbEditBtn').addEventListener('click', () => {
        const m = getMeals().find(x => x.id === id);
        if (!m) return;
        state.addDraft = {
          id: m.id,
          name: m.name || '',
          instructions: m.instructions || '',
          sourceType: m.sourceType || 'cookbook',
          sourceDetail: m.sourceDetail || '',
          categories: [...(m.categories || [])],
          prepTime: m.prepTime || '',
          servings: m.servings || 4,
          ingredients: (m.ingredients && m.ingredients.length > 0) ? JSON.parse(JSON.stringify(m.ingredients)) : [{ amount: '', unit: 'g', name: '' }],
          photo: m.photo || null,
          saving: false, error: null, scanning: false, scanError: null, scanSuccess: false,
          dateAdded: m.dateAdded || Date.now()
        };
        state.overlay = 'add';
        renderOverlay();
      });

      document.getElementById('rbServMinus').addEventListener('click', () => {
        state.detailServings = Math.max(1, (state.detailServings || 1) - 1);
        renderOverlay();
      });
      document.getElementById('rbServPlus').addEventListener('click', () => {
        state.detailServings = (state.detailServings || 1) + 1;
        renderOverlay();
      });
      document.querySelectorAll('#rbOverlay [data-heart]').forEach(el => {
        el.addEventListener('click', () => { toggleLike(el.getAttribute('data-heart')); renderOverlay(); renderBody(); });
      });
    }

    function addSheetHtml() {
      const d = state.addDraft;
      const ingRows = d.ingredients.map((ing, i) => `
        <div class="rb-ing-row" data-idx="${i}">
          <input class="rb-input rb-ing-amount" type="text" inputmode="decimal" pattern="[0-9.,]*" placeholder="Menge" value="${ing.amount}">
          <select class="rb-input rb-ing-unit">${UNITS.map(u => `<option value="${u}" ${ing.unit === u ? 'selected' : ''}>${u}</option>`).join('')}</select>
          <input class="rb-input rb-ing-name" placeholder="Zutat" value="${escapeHtml(ing.name)}">
          <button class="rb-ing-remove" data-idx="${i}">×</button>
        </div>`).join('');
      return `
        <div class="rb-overlay" id="rbOverlay">
          <div class="rb-sheet">
            <div class="rb-sheet-head">
              <p class="rb-sheet-title">${d.id ? 'Rezept bearbeiten' : 'Neues Gericht'}</p>
              <button class="rb-close" id="rbAddClose">✕</button>
            </div>

            <button class="rb-scan-btn" id="rbScanBtn" ${d.scanning ? 'disabled' : ''}>${d.scanning ? '🔎 Rezept wird erkannt…' : '📷 Rezept aus Foto einlesen'}</button>
            <input type="file" accept="image/*" id="rbScanInput" style="display:none">
            ${d.scanError ? `<p class="rb-scan-error">${escapeHtml(d.scanError)}</p>` : ''}
            ${d.scanSuccess ? `<p class="rb-scan-status">✓ Felder ausgefüllt — bitte kurz prüfen.</p>` : ''}

            <div class="rb-field">
              <label class="rb-label">Foto vom Gericht</label>
              <div class="rb-photo-well" id="rbPhotoWell">${d.photo ? `<img src="${d.photo}" alt="">` : 'Zum Hinzufügen eines Fotos tippen'}</div>
              <input type="file" accept="image/*" id="rbPhotoInput" style="display:none">
            </div>

            <div class="rb-field">
              <label class="rb-label">Name des Gerichts</label>
              <input class="rb-input" id="rbNameInput" placeholder="z. B. Omas Lasagne" value="${escapeHtml(d.name)}">
            </div>

            <div class="rb-field">
              <label class="rb-label">Quelle</label>
              <div class="rb-source-row" id="rbSourceRow">
                ${SOURCE_TYPES.map(s => `<div class="rb-source-btn ${d.sourceType === s.key ? 'active' : ''}" data-key="${s.key}">${s.label}</div>`).join('')}
              </div>
              <input class="rb-input" id="rbSourceDetail" placeholder="${SOURCE_TYPES.find(s=>s.key===d.sourceType).placeholder}" value="${escapeHtml(d.sourceDetail)}">
            </div>

            <div class="rb-field">
              <label class="rb-label">Zubereitungszeit</label>
              <div class="rb-time-row" id="rbTimeRow">
                ${TIME_PRESETS.map(t => `<div class="rb-time-chip ${d.prepTime === t ? 'active' : ''}" data-time="${t}">${t}</div>`).join('')}
              </div>
              <input class="rb-input" id="rbPrepInput" placeholder="z. B. 30 Min." value="${escapeHtml(d.prepTime)}">
            </div>

            <div class="rb-field">
              <label class="rb-label">Kategorien</label>
              <div class="rb-cat-row" id="rbCatRow">
                ${Array.from(new Set([...SUGGESTED_CATEGORIES, ...allCategories()])).map(c => `<div class="rb-cat-chip ${d.categories.includes(c) ? 'selected' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join('')}
              </div>
              <div class="rb-cat-add-row">
                <input class="rb-input" id="rbCatCustom" placeholder="Eigenen Tag hinzufügen">
                <button class="rb-small-btn" id="rbCatAddBtn">Hinzufügen</button>
              </div>
            </div>

            <div class="rb-field">
              <label class="rb-label">Portionen (Personen)</label>
              <input class="rb-input" id="rbServingsInput" type="number" min="1" step="1" value="${d.servings}">
            </div>

            <div class="rb-field">
              <label class="rb-label">Zutaten</label>
              <div id="rbIngRows">${ingRows}</div>
              <button class="rb-small-btn rb-ing-add-btn" id="rbIngAddBtn">+ Zutat</button>
            </div>

            <div class="rb-field">
              <label class="rb-label">Zubereitung</label>
              <textarea class="rb-textarea" id="rbInstructionsInput" placeholder="Schritte, Hinweise…">${escapeHtml(d.instructions)}</textarea>
            </div>

            ${d.error ? `<div class="rb-error">${escapeHtml(d.error)}</div>` : ''}
            <button class="rb-save-btn" id="rbSaveBtn" ${d.saving ? 'disabled' : ''}>${d.saving ? 'Wird gespeichert…' : (d.id ? 'Änderungen speichern' : 'Gericht speichern')}</button>
          </div>
        </div>`;
    }

    function bindAddSheet() {
      const d = state.addDraft;
      document.getElementById('rbOverlay').addEventListener('click', e => { if (e.target.id === 'rbOverlay') closeOverlay(); });
      document.getElementById('rbAddClose').addEventListener('click', closeOverlay);

      document.getElementById('rbNameInput').addEventListener('input', e => { d.name = e.target.value; });
      document.getElementById('rbInstructionsInput').addEventListener('input', e => { d.instructions = e.target.value; });
      document.getElementById('rbSourceDetail').addEventListener('input', e => { d.sourceDetail = e.target.value; });
      document.getElementById('rbPrepInput').addEventListener('input', e => { d.prepTime = e.target.value; });
      document.getElementById('rbServingsInput').addEventListener('input', e => { d.servings = e.target.value; });

      document.getElementById('rbSourceRow').querySelectorAll('.rb-source-btn').forEach(el => {
        el.addEventListener('click', () => { d.sourceType = el.getAttribute('data-key'); renderOverlay(); });
      });
      document.getElementById('rbTimeRow').querySelectorAll('.rb-time-chip').forEach(el => {
        el.addEventListener('click', () => { d.prepTime = el.getAttribute('data-time'); renderOverlay(); });
      });
      document.getElementById('rbCatRow').querySelectorAll('.rb-cat-chip').forEach(el => {
        el.addEventListener('click', () => {
          const c = el.getAttribute('data-cat');
          const idx = d.categories.indexOf(c);
          if (idx >= 0) d.categories.splice(idx, 1); else d.categories.push(c);
          renderOverlay();
        });
      });
      document.getElementById('rbCatAddBtn').addEventListener('click', () => {
        const input = document.getElementById('rbCatCustom');
        const val = input.value.trim();
        if (val && !d.categories.includes(val)) d.categories.push(val);
        renderOverlay();
      });

      document.getElementById('rbIngRows').querySelectorAll('.rb-ing-row').forEach(row => {
        const i = Number(row.getAttribute('data-idx'));
        row.querySelector('.rb-ing-amount').addEventListener('input', e => { d.ingredients[i].amount = e.target.value; });
        row.querySelector('.rb-ing-unit').addEventListener('change', e => { d.ingredients[i].unit = e.target.value; });
        row.querySelector('.rb-ing-name').addEventListener('input', e => { d.ingredients[i].name = e.target.value; });
        row.querySelector('.rb-ing-remove').addEventListener('click', () => { d.ingredients.splice(i, 1); renderOverlay(); });
      });
      document.getElementById('rbIngAddBtn').addEventListener('click', () => {
        d.ingredients.push({ amount: '', unit: 'g', name: '' });
        renderOverlay();
      });

      const photoWell = document.getElementById('rbPhotoWell');
      const photoInput = document.getElementById('rbPhotoInput');
      photoWell.addEventListener('click', () => photoInput.click());
      photoInput.addEventListener('change', async () => {
        const file = photoInput.files[0];
        if (!file) return;
        try { d.photo = await resizeImage(file, 800, 0.68); renderOverlay(); }
        catch (e) { d.error = 'Dieses Foto konnte nicht gelesen werden. Versuch ein anderes.'; renderOverlay(); }
      });

      const scanBtn = document.getElementById('rbScanBtn');
      const scanInput = document.getElementById('rbScanInput');
      scanBtn.addEventListener('click', () => scanInput.click());
      scanInput.addEventListener('change', async () => {
        const file = scanInput.files[0];
        if (!file) return;
        d.scanning = true; d.scanError = null; d.scanSuccess = false;
        renderOverlay();
        try {
          const dataUrl = await resizeImage(file, 1600, 0.85);
          const base64 = dataUrl.split(',')[1];
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-6',
              max_tokens: 1500,
              messages: [{
                role: 'user',
                content: [
                  { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
                  { type: 'text', text: 'Extrahiere aus diesem Rezeptfoto (Kochbuchseite, handschriftliche Notiz oder Screenshot) folgende Angaben. Antworte AUSSCHLIESSLICH mit einem reinen JSON-Objekt, ohne Markdown-Codeblock, ohne jeglichen weiteren Text, auf Deutsch:\n{"name": "Name des Gerichts", "servings": Zahl, "prepTime": "z.B. 30 Min. oder leerer String", "ingredients": [{"amount": Zahl oder null, "unit": "g|kg|ml|l|TL|EL|Tasse|Stk.|Prise|oz|lb|Zehe|Scheibe|Dose|Bund|sonst.", "name": "Zutat"}], "instructions": "Fließtext der Zubereitungsschritte"}\nWenn eine Angabe nicht erkennbar ist, nutze sinnvolle Standardwerte (servings: 4) oder leere Strings/Arrays.' }
                ]
              }]
            })
          });
          const data = await response.json();
          const text = (data.content || []).map(b => b.text || '').join('');
          const clean = text.replace(/```json|```/g, '').trim();
          const parsed = JSON.parse(clean);
          if (parsed.name) d.name = parsed.name;
          if (parsed.servings) d.servings = parsed.servings;
          if (parsed.prepTime) d.prepTime = parsed.prepTime;
          if (parsed.instructions) d.instructions = parsed.instructions;
          if (Array.isArray(parsed.ingredients) && parsed.ingredients.length > 0) {
            d.ingredients = parsed.ingredients.map(ing => ({
              amount: (ing.amount === null || ing.amount === undefined || ing.amount === '') ? '' : String(ing.amount),
              unit: matchUnit(ing.unit),
              name: ing.name || ''
            }));
          }
          d.scanning = false;
          d.scanSuccess = true;
          renderOverlay();
        } catch (e) {
          d.scanning = false;
          d.scanError = 'Das Rezept konnte nicht automatisch erkannt werden. Bitte manuell eintragen oder ein anderes Foto versuchen.';
          renderOverlay();
        }
      });

      document.getElementById('rbSaveBtn').addEventListener('click', async () => {
        if (!d.name.trim()) { d.error = 'Bitte gib dem Gericht zuerst einen Namen.'; renderOverlay(); return; }
        d.error = null;
        d.saving = true;
        renderOverlay();
        const entry = {
          id: d.id || newId(),
          name: d.name.trim(),
          instructions: d.instructions.trim(),
          sourceType: d.sourceType,
          sourceDetail: d.sourceDetail.trim(),
          categories: d.categories,
          prepTime: d.prepTime.trim(),
          servings: Number(d.servings) || 1,
          ingredients: d.ingredients.filter(ing => ing.name && ing.name.trim()).map(ing => ({ amount: ing.amount === '' ? null : Number(ing.amount), unit: ing.unit, name: ing.name.trim() })),
          photo: d.photo,
          addedBy: state.user.uid,
          addedByName: state.user.displayName || state.user.email || '',
          dateAdded: d.dateAdded || Date.now()
        };
        try { await saveRecipe(entry); closeOverlay(); }
        catch (e) { d.saving = false; d.error = 'Konnte nicht gespeichert werden. Prüfe deine Verbindung und versuch es erneut.'; renderOverlay(); }
      });
    }

    function resizeImage(file, maxDim, quality) {
      maxDim = maxDim || 800; quality = quality || 0.68;
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > h) { if (w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; } }
            else { if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; } }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('bad image'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('read error'));
        reader.readAsDataURL(file);
      });
    }

    render();
  </script>
</body>
</html>
