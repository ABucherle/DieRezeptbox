<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Die Rezeptbox</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --ink: #2B2620;
      --paper: #F6EFDE;
      --paper-2: #EFE4CB;
      --white: #FFFDF8;
      --wine: #7A2E33;
      --wine-dark: #55202A;
      --rust: #B5502D;
      --butter: #E8B23D;
      --line: #C9BFA8;
    }

    .rb-root * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    .rb-root {
      font-family: 'Work Sans', sans-serif;
      color: var(--ink);
      background: var(--paper);
      min-height: 100vh;
      padding: 0 0 100px 0;
      -webkit-font-smoothing: antialiased;
    }

    .rb-fab, .rb-close, .rb-small-btn, .rb-save-btn, .rb-source-btn, .rb-time-chip, .rb-cat-chip, .rb-heart, .rb-stepper button, .rb-ing-remove, .rb-filter-btn, .rb-fav-toggle, .rb-active-chip, .rb-edit-btn {
      -webkit-user-select: none; user-select: none;
    }

    .rb-header { padding: 28px 20px 14px 20px; }
    .rb-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px; margin: 0; letter-spacing: -0.01em; }
    .rb-subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--wine-dark); margin: 4px 0 0 0; text-transform: uppercase; letter-spacing: 0.08em; }

    /* NEU: Filter Leiste mit Quick-Access Favoriten-Toggle */
    .rb-filter-bar { display: flex; align-items: center; gap: 8px; padding: 0 20px; margin-top: 18px; }
    .rb-filter-btn { 
      font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; 
      padding: 8px 16px; border-radius: 20px; border: 1px solid var(--line); 
      background: var(--white); color: var(--ink); cursor: pointer; 
      display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(43,38,32,0.05);
    }
    .rb-filter-btn.active { background: var(--wine); color: var(--paper); border-color: var(--wine); }
    
    .rb-fav-toggle {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--line); transition: all 0.2s;
    }
    .rb-fav-toggle.active { background: var(--rust); border-color: var(--rust); color: var(--white); }
    
    .rb-active-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .rb-active-chips::-webkit-scrollbar { display: none; }
    .rb-active-chip { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 12px 6px 14px; border-radius: 16px; background: var(--paper-2); color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); cursor: pointer; }

    .rb-gallery { padding: 18px 20px 0 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    @media (min-width: 640px) { .rb-gallery { grid-template-columns: repeat(3, 1fr); } }

    .rb-card { background: var(--white); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; box-shadow: 0 1px 0 rgba(43,38,32,0.05); }
    .rb-card-tab { height: 6px; width: 100%; }
    .rb-card-photo-wrap { padding: 10px 10px 0 10px; position: relative; }
    .rb-card-photo { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 2px; border: 4px solid var(--white); outline: 1px solid var(--line); transform: rotate(-1deg); display: block; background: var(--paper-2); }
    .rb-card-photo-empty { width: 100%; aspect-ratio: 1/1; border-radius: 2px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; color: var(--line); font-family: 'IBM Plex Mono', monospace; font-size: 24px; background: var(--paper); }
    .rb-card-body { padding: 10px 12px 12px 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .rb-card-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; line-height: 1.2; margin: 0; }
    .rb-card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .rb-chip { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--paper-2); color: var(--wine-dark); white-space: nowrap; }
    .rb-chip-time { background: var(--butter); color: var(--ink); }

    .rb-heart { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,253,248,0.9); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; z-index: 2; color: var(--ink); }
    .rb-heart.liked { color: var(--rust); border-color: var(--rust); }
    .rb-heart-detail { font-size: 20px; }

    .rb-fab { position: fixed; right: 36px; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; background: var(--rust); color: var(--paper); border: none; font-size: 28px; box-shadow: 0 4px 14px rgba(181,80,45,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 40; }

    .rb-overlay { position: fixed; inset: 0; background: rgba(20,17,13,0.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s ease-out forwards; }
    .rb-sheet { background: var(--white); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px; box-shadow: 0 -8px 40px rgba(20,17,13,0.35); border-top: 1px solid var(--line); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    .rb-close { background: none; border: none; font-size: 20px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    .rb-input, .rb-textarea { width: 100%; border: 1px solid var(--line); padding: 10px 12px; font-family: 'Work Sans'; font-size: 16px; border-radius: 6px; }

    .rb-cat-chip { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--white); cursor: pointer; color: var(--ink); }
    .rb-cat-chip.selected { background: var(--butter); border-color: var(--butter); color: var(--ink); }

    .rb-save-btn, .rb-edit-btn { width: 100%; padding: 13px; border-radius: 8px; border: none; background: var(--wine); color: var(--paper); font-size: 16px; cursor: pointer; margin-top: 6px; }
    .rb-edit-btn { background: var(--butter); color: var(--ink); }
    .rb-delete-btn { width: 100%; background: none; border: none; color: var(--rust); font-size: 13px; padding: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="rb-root" id="rbRoot">
    <div class="rb-header">
      <p class="rb-title">Die Rezeptbox</p>
      <p class="rb-subtitle">ein gemeinsames Verzeichnis unvergesslicher Gerichte</p>
    </div>
    <div id="rbFilterWrap"></div>
    <div id="rbBody"><div class="rb-loading">Box wird geöffnet…</div></div>
    <button class="rb-fab" id="rbFab">+</button>
  </div>
  <div id="rbOverlayHost"></div>

  <script>
  (function(){
    const state = { meals: [], loading: true, activeFilters: new Set(), showFavoritesOnly: false, overlay: null, addDraft: null, detailServings: null };

    // ... (restliche Funktionen bleiben gleich, hier nur die angepassten Teile)
    
    function renderFilterBar() {
      const wrap = document.getElementById('rbFilterWrap');
      const cats = allCategories();
      if (state.loading) return;
      
      wrap.innerHTML = `
        <div class="rb-filter-bar">
          <button class="rb-fav-toggle ${state.showFavoritesOnly ? 'active' : ''}" id="rbFavToggle">♥</button>
          <button class="rb-filter-btn ${state.activeFilters.size > 0 ? 'active' : ''}" id="rbOpenFilterBtn">Filter</button>
          <div class="rb-active-chips" id="rbActiveChipsWrap"></div>
        </div>
      `;

      // Event Listener
      document.getElementById('rbFavToggle').addEventListener('click', () => { state.showFavoritesOnly = !state.showFavoritesOnly; render(); });
      document.getElementById('rbOpenFilterBtn').addEventListener('click', () => { state.overlay = 'filter'; render(); });
      
      const chipsWrap = document.getElementById('rbActiveChipsWrap');
      state.activeFilters.forEach(f => {
        const chip = document.createElement('div');
        chip.className = 'rb-active-chip';
        chip.innerHTML = `${escapeHtml(f)} <span>×</span>`;
        chip.onclick = () => { state.activeFilters.delete(f); render(); };
        chipsWrap.appendChild(chip);
      });
    }

    // ... Rest deines JS (loadMeals, renderBody, renderOverlay, etc. bleiben wie gehabt)

    // WICHTIG: Stelle sicher, dass die loadMeals() und render() Aufrufe am Ende noch wie vorher funktionieren.
    loadMeals();
  })();
  </script>
</body>
</html>
