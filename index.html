  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap');

    html, body {
      margin: 0; padding: 0; height: 100%;
      background: linear-gradient(160deg, #EAF6EF 0%, #E4F1F5 100%);
    }

    :root {
      --bg-1: #EAF6EF;
      --bg-2: #E4F1F5;
      --glass: rgba(255,255,255,0.55);
      --glass-strong: rgba(255,255,255,0.74);
      --glass-border: rgba(90,150,140,0.22);
      --ink: #16302A;
      --muted: #5C7A73;
      --accent: #82C3F5;
      --on-accent: #0E3A56;
      --mint: #14A585;
      --mint-bg: rgba(20,165,133,0.14);
      --mint-ink: #0E8069;
      --tag-bg: rgba(90,150,140,0.12);
      --heart-bg: rgba(255,255,255,0.75);
      --row-border: rgba(90,150,140,0.18);
      --photo-grad: linear-gradient(135deg,#BEE8D4,#B7D6EF);
      --danger: #C1584F;
      --tab-a: var(--accent);
      --tab-b: var(--mint-ink);
      --tab-c: #5C9BD1;
    }

    .rb-root * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    .rb-root {
      font-family: 'Work Sans', -apple-system, sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0 0 100px 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    .rb-fab, .rb-close, .rb-small-btn, .rb-save-btn, .rb-source-btn, .rb-time-chip, .rb-cat-chip, .rb-heart, .rb-stepper button, .rb-ing-remove, .rb-filter-btn, .rb-active-chip, .rb-edit-btn, .rb-signout-btn {
      -webkit-user-select: none;

    }
    svg.rb-icon { display: block; flex-shrink: 0; }

    .rb-topbar { padding: 30px 20px 14px 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .rb-title {

      font-weight: 800;
      font-size: 32px;

    .rb-subtitle {

    .rb-signout-btn { font-family: 'Work Sans', sans-serif; font-size: 12px; color: var(--muted); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 4px 0; }

      background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: var(--ink); cursor: pointer; 
      display: flex; align-items: center; gap: 6px; flex-shrink: 0; 
      box-shadow: 0 2px 10px rgba(40,90,80,0.06); transition: all 0.15s ease;
    }
    .rb-filter-btn:active { transform: scale(0.96); }
    .rb-filter-btn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    
    .rb-active-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }

    .rb-active-chip {

      color: var(--ink); white-space: nowrap; display: flex; align-items: center;

    @media (min-width: 900px) { .rb-gallery { grid-template-columns: repeat(4, 1fr); } }

    .rb-card { position: relative; isolation: isolate; border-radius: 20px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; border: 1px solid var(--glass-border); box-shadow: 0 8px 24px rgba(40,90,80,0.10); background: transparent; }
    .rb-card::before { content: ''; position: absolute; inset: -1px; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: -1; }

    .rb-chip { font-family: 'Work Sans', sans-serif; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: var(--tag-bg); color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 3px; }
    .rb-chip-time { background: var(--mint-bg); color: var(--mint-ink); }
    .rb-chip-author { background: var(--accent); color: var(--on-accent); }

    .rb-heart { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--heart-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; color: var(--ink); }
    .rb-heart-detail { width: 40px; height: 40px; }

    .rb-empty { margin: 40px 20px; text-align: center; padding: 40px 20px; border: 1px dashed var(--glass-border); border-radius: 16px; background: var(--glass); }

    .rb-empty-sub { font-size: 14px; color: var(--muted); margin: 0; }

    .rb-fab { position: fixed; right: 24px; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, #97CDF7, #6FAEE0); border: none; box-shadow: 0 8px 22px rgba(130,195,245,0.45); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 40; }
    .rb-fab:active { transform: scale(0.94); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .rb-overlay { position: fixed; inset: 0; background: rgba(15,35,30,0.35); backdrop-filter: blur(2px); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s ease-out forwards; }
    .rb-sheet { background: var(--glass-strong); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px; box-shadow: 0 -16px 50px rgba(20,60,50,0.18); border-top: 1px solid var(--glass-border); overscroll-behavior-y: contain; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @media (min-width: 640px) { .rb-overlay { align-items: center; } .rb-sheet { border-radius: 20px; max-height: 88vh; border: 1px solid var(--glass-border); } }
    .rb-sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .rb-sheet-title { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 19px; margin: 0; }
    
    .rb-close { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 50%; color: var(--ink); cursor: pointer; width: 34px; height: 34px; min-width: 34px; min-height: 34px; display: flex; align-items: center; justify-content: center; padding: 0; }

    .rb-field { margin-bottom: 16px; }
    .rb-label { display: block; font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    
    .rb-input, .rb-textarea, select.rb-input {
      width: 100%; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.6); border-radius: 10px; padding: 10px 12px;
      font-family: 'Work Sans', sans-serif; font-size: 16px; color: var(--ink);
    }
    .rb-textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
    .rb-input:focus, .rb-textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    .rb-source-row, .rb-cat-row, .rb-time-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .rb-source-btn, .rb-time-chip { font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 7px 13px; border-radius: 16px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.5); cursor: pointer; color: var(--ink); }
    .rb-source-btn.active, .rb-time-chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

    .rb-cat-chip { font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 6px 13px; border-radius: 16px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.5); cursor: pointer; color: var(--ink); transition: background 0.15s; }
    .rb-cat-chip.selected { background: var(--mint-bg); border-color: var(--mint); color: var(--mint-ink); font-weight: 600; }
    .rb-cat-add-row { display: flex; gap: 6px; }
    .rb-cat-add-row .rb-input { flex: 1; }
    .rb-small-btn { font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 600; padding: 0 14px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.5); cursor: pointer; color: var(--ink); }

    .rb-photo-well { width: 100%; aspect-ratio: 16/9; border: 1.5px dashed var(--glass-border); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: 'Work Sans', sans-serif; font-size: 13px; cursor: pointer; overflow: hidden; background: rgba(255,255,255,0.4); flex-direction: column; gap: 6px; }
    .rb-photo-well img { width: 100%; height: 100%; object-fit: cover; }

    .rb-scan-btn { width: 100%; padding: 13px; border: 1.5px dashed var(--accent); border-radius: 14px; background: rgba(130,195,245,0.10); color: var(--on-accent); font-family: 'Work Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .rb-scan-btn:disabled { opacity: 0.6; cursor: default; }
    .rb-scan-status { font-family: 'Work Sans', sans-serif; font-size: 12px; color: var(--mint-ink); margin: 0 0 16px 0; display: flex; align-items: center; gap: 6px; }
    .rb-scan-error { font-family: 'Work Sans', sans-serif; font-size: 12px; color: var(--danger); margin: 0 0 16px 0; }

    .rb-stepper .rb-stepper-val { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 16px; min-width: 24px; text-align: center; }

    .rb-ing-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    .rb-ing-table th { font-family: 'Work Sans', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--row-border); }

    .rb-save-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg, #97CDF7, #6FAEE0); color: var(--on-accent); font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 6px; }
    .rb-edit-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: var(--mint-bg); color: var(--mint-ink); font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 32px; margin-bottom: 8px; }
    .rb-save-btn:disabled { opacity: 0.5; cursor: default; }
    .rb-error { font-family: 'Work Sans', sans-serif; font-size: 12px; color: var(--danger); margin-top: -8px; margin-bottom: 12px; }

    .rb-detail-photo-wrap { position: relative; margin-bottom: 16px; }
    .rb-detail-photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 18px; display: block; background: var(--photo-grad); }
    .rb-detail-name-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .rb-detail-name { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 25px; letter-spacing: -0.01em; margin: 0 0 6px 0; }
    .rb-detail-source { font-family: 'Work Sans', sans-serif; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .rb-detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .rb-detail-section-label { font-family: 'Work Sans', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 18px 0 8px 0; border-top: 1px solid var(--row-border); padding-top: 14px; }

    .rb-delete-btn { width: 100%; background: none; border: none; color: var(--danger); font-family: 'Work Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 10px 14px; border-radius: 10px; cursor: pointer; text-align: center; }

    .rb-loading, .rb-status { text-align: center; font-family: 'Work Sans', sans-serif; font-size: 13px; color: var(--muted); padding: 40px 20px; }

    /* Login screen */
    .rb-login { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; gap: 8px; }
    .rb-login-title { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 30px; margin: 0; letter-spacing: -0.02em; }
    .rb-login-sub { font-family: 'Work Sans', sans-serif; font-size: 14px; color: var(--muted); margin: 0 0 28px 0; max-width: 320px; line-height: 1.6; }
    .rb-authbox { width: 100%; max-width: 320px; text-align: left; }
    .rb-login-error { font-family: 'Work Sans', sans-serif; font-size: 12px; color: var(--danger); margin-top: 10px; max-width: 320px; }
    .rb-login-note { font-family: 'Work Sans', sans-serif; font-size: 12px; color: var(--muted); margin-top: 40px; max-width: 300px; line-height: 1.6; }

    @media (prefers-reduced-motion: reduce) { .rb-fab, .rb-sheet, .rb-overlay { transition: none; animation: none; } }
  </style>
</head>

      close: '<svg class="rb-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
      camera: '<svg class="rb-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>',
      search: '<svg class="rb-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>',
      plus: '<svg class="rb-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
    };
    function newId() { return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }
    function fmtAmt(n) {
      if (n === null || n === undefined || isNaN(n)) return '';
      const r = Math.round(n * 100) / 100;
      return String(r).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
    }
    function matchUnit(u) {
      if (!u) return 'g';
      const found = UNITS.find(x => x.toLowerCase() === String(u).toLowerCase());
      return found || 'sonst.';
    }
    function initials(name) {
      if (!name) return '?';
      return name.trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
    }

    // ---------- Icons ----------
    function iconHeart(filled) {
      return filled
        ? `<svg class="rb-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>`
        : `<svg class="rb-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>`;
    }
    function iconClock() {
      return `<svg class="rb-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
    }
    function iconClose() {
      return `<svg class="rb-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
    }
    function iconPlate() {
      return `<svg class="rb-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.3"/></svg>`;
    }
    function iconCamera() {
      return `<svg class="rb-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
    }
    function iconSearch() {
      return `<svg class="rb-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`;
    }
    function iconCheck() {
      return `<svg class="rb-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
    }
    function iconPlus(size) {
      size = size || 22;
      return `<svg class="rb-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
    }
    function iconTrash() {
      return `<svg class="rb-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>`;
    }
    function iconEdit() {
      return `<svg class="rb-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`;
    }

    // ---------- Auth ----------
    onAuthStateChanged(auth, (user) => {
      state.authLoading = false;
      state.user = user;
      if (user) { subscribeToData(user); }
      else { teardownSubscriptions(); resetLocalState(); }
      render();
    });

    function resetLocalState() {
      state.recipesRaw = []; state.favoriteIds = new Set();
      state.recipesLoaded = false; state.favesLoaded = false;
      state.activeFilters = new Set(); state.showFavoritesOnly = false;
      state.overlay = null; state.addDraft = null;
    }
    function teardownSubscriptions() {
      if (unsubRecipes) { unsubRecipes(); unsubRecipes = null; }
      if (unsubFaves) { unsubFaves(); unsubFaves = null; }
    }

    // Wandelt den eingegebenen Namen in eine interne, unsichtbare Kennung um.
    // Der Nutzer sieht nie eine E-Mail-Adresse, Firebase braucht aber intern eine.
    function nameToInternalEmail(name) {
      const slug = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      return (slug || 'nutzer') + '@rezeptbox.local';
    }

    function translateAuthError(e) {
      const code = e && e.code;
      if (code === 'auth/email-already-in-use') return 'Diesen Namen gibt es schon. Bitte einen anderen wählen oder stattdessen anmelden.';
      if (code === 'auth/weak-password') return 'Das Passwort muss mindestens 6 Zeichen haben.';
      if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Falsches Passwort oder falscher Name.';
      if (code === 'auth/user-not-found') return 'Diesen Namen gibt es noch nicht. Erst registrieren.';
      if (code === 'auth/too-many-requests') return 'Zu viele Versuche. Bitte kurz warten und erneut versuchen.';
      if (code === 'auth/operation-not-allowed') return 'E-Mail/Passwort-Anmeldung ist in Firebase noch nicht aktiviert (Authentication → Sign-in method).';
      if (code === 'auth/network-request-failed') return 'Keine Internetverbindung erkannt. Bitte prüfen und erneut versuchen.';
      return 'Das hat leider nicht geklappt. (Code: ' + (code || 'unbekannt') + ')';
    }

    async function doAuthSubmit() {
      const name = state.authEmail.trim();
      const password = state.authPassword;
      if (!name || !password) { state.authError = 'Bitte Namen und Passwort eingeben.'; render(); return; }
      const internalEmail = nameToInternalEmail(name);
      state.authError = null; state.authBusy = true; render();
      try {
        if (state.authMode === 'register') {
          const cred = await createUserWithEmailAndPassword(auth, internalEmail, password);
          await updateProfile(cred.user, { displayName: name });
          state.user = cred.user;
        } else {
          await signInWithEmailAndPassword(auth, internalEmail, password);
        }
      } catch (e) {
        state.authError = translateAuthError(e);
        state.authBusy = false;
        render();
      }
    }
    async function doSignOut() {
      teardownSubscriptions();
      await signOut(auth);
    }

    // ---------- Firestore subscriptions ----------
    function subscribeToData(user) {
      teardownSubscriptions();
      state.error = null;

      unsubRecipes = onSnapshot(
        collection(db, 'recipes'),
        (snap) => {
          state.recipesRaw = snap.docs.map(d => d.data());
          state.recipesLoaded = true;
          render();
        },
        (err) => { state.error = 'Rezepte konnten nicht geladen werden. Prüfe deine Verbindung.'; render(); }
      );

      const favQuery = query(collection(db, 'favorites'), where('uid', '==', user.uid));
      unsubFaves = onSnapshot(
        favQuery,
        (snap) => {
          const ids = new Set();
          snap.docs.forEach(d => { if (d.data().liked) ids.add(d.data().recipeId); });
          state.favoriteIds = ids;
          state.favesLoaded = true;
          render();
        },
        (err) => { state.favesLoaded = true; render(); }
      );
    }

    function getMeals() {
      return state.recipesRaw
        .map(m => Object.assign({}, m, { liked: state.favoriteIds.has(m.id) }))
        .sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0));
    }

    async function saveRecipe(entry) {
      await setDoc(doc(db, 'recipes', entry.id), entry);
    }
    async function deleteRecipe(id) {
      await deleteDoc(doc(db, 'recipes', id));
    }
    async function toggleLike(id) {
      const liked = !state.favoriteIds.has(id);
      // optimistic UI update
      if (liked) state.favoriteIds.add(id); else state.favoriteIds.delete(id);
      render();
      try {
        await setDoc(doc(db, 'favorites', state.user.uid + '_' + id), {
          uid: state.user.uid, recipeId: id, liked
        });
      } catch (e) {
        if (liked) state.favoriteIds.delete(id); else state.favoriteIds.add(id);
        render();
      }
    }

    function allCategories() {
      const set = new Set();
      state.recipesRaw.forEach(m => (m.categories || []).forEach(c => set.add(c)));
      return Array.from(set).sort();
    }

    function filteredMeals() {
      let list = getMeals();
      if (state.showFavoritesOnly) list = list.filter(m => m.liked);
      if (state.activeFilters.size > 0) {
        list = list.filter(m => {
          const cats = new Set(m.categories || []);
          for (const f of state.activeFilters) if (!cats.has(f)) return false;
          return true;
        });
      }
      return list;
    }

    // ---------- Render root ----------
    function render() {
      const host = document.getElementById('rbApp');
      if (state.authLoading) { host.innerHTML = '<div class="rb-loading">Wird geladen…</div>'; return; }
      if (!state.user) { renderLogin(host); return; }
      renderAppShell(host);
    }

    function renderLogin(host) {
      host.innerHTML = `
        <div class="rb-login">
          <p class="rb-login-title">Die Rezeptbox</p>
          <p class="rb-login-sub">Euer gemeinsames Verzeichnis unvergesslicher Gerichte.</p>

          <div class="rb-authbox">
            <div class="rb-field" style="text-align:left;">
              <label class="rb-label">Name</label>
              <input class="rb-input" id="rbAuthName" placeholder="z. B. Anna" value="${escapeHtml(state.authEmail)}" autocapitalize="words" autocomplete="username">
            </div>
            <div class="rb-field" style="text-align:left;">
              <label class="rb-label">Passwort</label>
              <input class="rb-input" id="rbAuthPassword" type="password" placeholder="Mindestens 6 Zeichen" value="${escapeHtml(state.authPassword)}" autocomplete="${state.authMode === 'register' ? 'new-password' : 'current-password'}">
            </div>
            ${state.authError ? `<p class="rb-login-error">${escapeHtml(state.authError)}</p>` : ''}
            <button class="rb-save-btn" id="rbAuthSubmit" ${state.authBusy ? 'disabled' : ''} style="margin-top:4px;">
              ${state.authBusy ? 'Einen Moment…' : (state.authMode === 'register' ? 'Konto erstellen' : 'Anmelden')}
            </button>
            <button class="rb-signout-btn" id="rbAuthToggle" style="margin-top:14px;">
              ${state.authMode === 'register' ? 'Schon ein Konto? Hier anmelden' : 'Noch kein Konto? Hier erstellen'}
            </button>
          </div>

          <p class="rb-login-note">Nur wer diesen Link kennt und sich anmeldet, kann die Rezepte sehen und bearbeiten. Ihr beide erstellt euch je ein eigenes Konto mit eigenem Namen und Passwort — die Rezepte teilt ihr euch trotzdem.</p>
        </div>`;

      document.getElementById('rbAuthName').addEventListener('input', e => { state.authEmail = e.target.value; });
      document.getElementById('rbAuthPassword').addEventListener('input', e => { state.authPassword = e.target.value; });
      document.getElementById('rbAuthSubmit').addEventListener('click', doAuthSubmit);
      document.getElementById('rbAuthToggle').addEventListener('click', () => {
        state.authMode = state.authMode === 'register' ? 'login' : 'register';
        state.authError = null;
        render();
      });
    }

    function renderAppShell(host) {
      host.innerHTML = `
        <div class="rb-topbar">
          <div>
            <p class="rb-title">Die Rezeptbox</p>
            <p class="rb-subtitle">ein gemeinsames Verzeichnis unvergesslicher Gerichte</p>
          </div>
          <div class="rb-user-chip">
            ${state.user.photoURL
              ? `<img class="rb-user-avatar" src="${state.user.photoURL}" alt="">`
              : `<div class="rb-user-avatar-fallback">${escapeHtml(initials(state.user.displayName || state.user.email))}</div>`}
          </div>
        </div>
        <div style="padding:0 20px; margin-top:-10px; margin-bottom:4px; text-align:right;">
          <button class="rb-signout-btn" id="rbSignOutBtn">Abmelden</button>
        </div>
        <div id="rbFilterWrap"></div>
        <div id="rbBody"></div>
        <button class="rb-fab" id="rbFab" aria-label="Gericht hinzufügen">${ICONS.plus}</button>
      `;
      document.getElementById('rbSignOutBtn').addEventListener('click', doSignOut);
      document.getElementById('rbFab').addEventListener('click', () => {
        state.addDraft = { id: null, name: '', instructions: '', sourceType: 'cookbook', sourceDetail: '', categories: [], prepTime: '', servings: 4, ingredients: [{ amount: '', unit: 'g', name: '' }], photo: null, saving: false, error: null, scanning: false, scanError: null, scanSuccess: false };
        state.overlay = 'add';
        renderOverlay();
      });

      renderFilterBar();
      renderBody();
      renderOverlay();
    }

    function renderFilterBar() {
      const wrap = document.getElementById('rbFilterWrap');
      if (!wrap) return;
      const cats = allCategories();
      if (!state.recipesLoaded) { wrap.innerHTML = ''; return; }
      if (cats.length === 0 && state.recipesRaw.length === 0) { wrap.innerHTML = ''; return; }

      const activeCount = state.activeFilters.size + (state.showFavoritesOnly ? 1 : 0);
      let activeChipsHtml = '';
      if (state.showFavoritesOnly) {
        activeChipsHtml += `<div class="rb-active-chip" data-remove="__fav__">${ICONS.heartFilled} Favoriten <span>×</span></div>`;
      }
      state.activeFilters.forEach(f => {
        activeChipsHtml += `<div class="rb-active-chip" data-remove="${escapeHtml(f)}">${escapeHtml(f)} <span>×</span></div>`;
      });

      wrap.innerHTML = `
        <div class="rb-filter-bar">
          <button class="rb-filter-btn ${activeCount > 0 ? 'active' : ''}" id="rbOpenFilterBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
            Filter ${activeCount > 0 ? `(${activeCount})` : ''}
          </button>
          <div class="rb-active-chips">${activeChipsHtml}</div>
        </div>
      `;

      document.getElementById('rbOpenFilterBtn').addEventListener('click', () => { state.overlay = 'filter'; renderOverlay(); });
      wrap.querySelectorAll('.rb-active-chip').forEach(el => {
        el.addEventListener('click', () => {
          const tab = el.getAttribute('data-remove');
          if (tab === '__fav__') state.showFavoritesOnly = false;
          else state.activeFilters.delete(tab);
          renderFilterBar(); renderBody();
        });
      });
    }

    function renderBody() {
      const body = document.getElementById('rbBody');
      if (!body) return;
      if (state.error) { body.innerHTML = `<div class="rb-status">${escapeHtml(state.error)}</div>`; return; }
      if (!state.recipesLoaded || !state.favesLoaded) { body.innerHTML = '<div class="rb-loading">Box wird geöffnet…</div>'; return; }

      const meals = filteredMeals();
      if (state.recipesRaw.length === 0) {
        body.innerHTML = `<div class="rb-empty"><p class="rb-empty-title">Noch keine Rezepte</p><p class="rb-empty-sub">Füg dein erstes unvergessliches Gericht hinzu.</p></div>`;
        return;
      }
      if (meals.length === 0) {
        body.innerHTML = `<div class="rb-empty"><p class="rb-empty-title">Keine Treffer</p><p class="rb-empty-sub">Ändere deine Filtereinstellungen, um Gerichte zu finden.</p></div>`;
        return;
      }
      body.innerHTML = `<div class="rb-gallery">${meals.map(cardHtml).join('')}</div>`;
      body.querySelectorAll('.rb-card').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-id');
          const m = getMeals().find(x => x.id === id);
          state.detailServings = m ? (m.servings || 4) : 4;
          state.overlay = { type: 'detail', id };
          renderOverlay();
        });
      });
      body.querySelectorAll('[data-heart]').forEach(el => {
        el.addEventListener('click', e => { e.stopPropagation(); toggleLike(el.getAttribute('data-heart')); });
      });
    }

    function cardHtml(m) {
      const color = tabColor((m.categories && m.categories[0]) || m.name || 'x');
      const photo = m.photo ? `<img class="rb-card-photo" src="${m.photo}" alt="">` : `<div class="rb-card-photo-empty">${ICONS.plate}</div>`;
      const catChips = (m.categories || []).slice(0, 2).map(c => `<span class="rb-chip">${escapeHtml(c)}</span>`).join('');
      const timeChip = m.prepTime ? `<span class="rb-chip rb-chip-time">${ICONS.clock} ${escapeHtml(m.prepTime)}</span>` : '';
      return `
        <div class="rb-card" data-id="${m.id}">
          <div class="rb-card-tab" style="background:${color}"></div>
          <div class="rb-card-photo-wrap">
            ${photo}
            <button class="rb-heart ${m.liked ? 'liked' : ''}" data-heart="${m.id}">${m.liked ? ICONS.heartFilled : ICONS.heartOutline}</button>
          </div>
          <div class="rb-card-body">
            <p class="rb-card-name">${escapeHtml(m.name)}</p>
            <div class="rb-card-tags">${timeChip}${catChips}</div>
          </div>
        </div>`;
    }

    function renderOverlay() {
      const existing = document.getElementById('rbOverlay');
      if (existing) existing.remove();
      if (!state.overlay) return;
      const host = document.getElementById('rbRoot');
      const wrap = document.createElement('div');
      if (state.overlay === 'add') { wrap.innerHTML = addSheetHtml(); host.appendChild(wrap.firstElementChild); bindAddSheet(); return; }
      if (state.overlay === 'filter') { wrap.innerHTML = filterSheetHtml(); host.appendChild(wrap.firstElementChild); bindFilterSheet(); return; }
      if (state.overlay.type === 'detail') { wrap.innerHTML = detailSheetHtml(state.overlay.id); host.appendChild(wrap.firstElementChild); bindDetailSheet(state.overlay.id); return; }
    }

    function closeOverlay() { state.overlay = null; state.addDraft = null; renderOverlay(); }

    function withPreservedScroll(fn) {
      const sheet = document.querySelector('#rbOverlay .rb-sheet');
      const scrollTop = sheet ? sheet.scrollTop : 0;
      fn();
      const newSheet = document.querySelector('#rbOverlay .rb-sheet');
      if (newSheet) newSheet.scrollTop = scrollTop;
    }

    function filterSheetHtml() {
      const cats = allCategories();
      return `
        <div class="rb-overlay" id="rbOverlay">
          <div class="rb-sheet">
            <div class="rb-sheet-head">
              <p class="rb-sheet-title">Rezepte filtern</p>
              <button class="rb-close" id="rbFilterClose">${ICONS.close}</button>
            </div>
            <div class="rb-field">
              <label class="rb-label">Besondere</label>
              <div class="rb-cat-row">
                <div class="rb-cat-chip ${state.showFavoritesOnly ? 'selected' : ''}" id="rbFilterFav">${ICONS.heartFilled} Nur Favoriten</div>
              </div>
            </div>
            <div class="rb-field">
              <label class="rb-label">Tags & Kategorien (Mehrfachauswahl)</label>
              <div class="rb-cat-row">
                ${cats.length === 0 ? '<p class="rb-empty-sub">Es wurden noch keine Tags vergeben.</p>' : ''}
                ${cats.map(c => `<div class="rb-cat-chip tag-filter-chip ${state.activeFilters.has(c) ? 'selected' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join('')}
              </div>
            </div>
            <button class="rb-save-btn" id="rbFilterClear" style="background: var(--paper-2); color: var(--wine-dark); border: 1px solid var(--line); margin-top: 24px;">Alle Filter zurücksetzen</button>
            <button class="rb-save-btn" id="rbFilterApply" style="margin-top: 8px;">Ergebnisse anzeigen</button>
          </div>
        </div>
      `;
    }

    function bindFilterSheet() {
      document.getElementById('rbOverlay').addEventListener('click', e => { if (e.target.id === 'rbOverlay') closeOverlay(); });
      document.getElementById('rbFilterClose').addEventListener('click', closeOverlay);
      document.getElementById('rbFilterApply').addEventListener('click', closeOverlay);
      document.getElementById('rbFilterFav').addEventListener('click', () => {
        state.showFavoritesOnly = !state.showFavoritesOnly;
        renderOverlay();
      });
      document.querySelectorAll('.tag-filter-chip').forEach(el => {
        el.addEventListener('click', () => {
          const c = el.getAttribute('data-cat');
          if (state.activeFilters.has(c)) state.activeFilters.delete(c);
          else state.activeFilters.add(c);
          renderOverlay();
        });
      });
      document.getElementById('rbFilterClear').addEventListener('click', () => {
        state.showFavoritesOnly = false;
        state.activeFilters.clear();
        closeOverlay();
        renderFilterBar(); renderBody();
      });
      document.getElementById('rbFilterApply').addEventListener('click', () => { renderFilterBar(); renderBody(); });
    }

    function detailSheetHtml(id) {
      const m = getMeals().find(x => x.id === id);
      if (!m) return '<div></div>';
      const sourceLabel = (SOURCE_TYPES.find(s => s.key === m.sourceType) || {}).label || 'Sonstiges';
      const sourceLine = m.sourceDetail ? `${sourceLabel} — ${escapeHtml(m.sourceDetail)}` : sourceLabel;
      const photo = m.photo ? `<div class="rb-detail-photo-wrap"><img class="rb-detail-photo" src="${m.photo}" alt=""><button class="rb-heart rb-heart-detail ${m.liked ? 'liked' : ''}" data-heart="${m.id}">${m.liked ? ICONS.heartFilled : ICONS.heartOutline}</button></div>` : '';
      const tags = (m.categories || []).map(c => `<span class="rb-chip">${escapeHtml(c)}</span>`).join('');
      const timeChip = m.prepTime ? `<span class="rb-chip rb-chip-time">${ICONS.clock} ${escapeHtml(m.prepTime)}</span>` : '';
      const baseServings = (m.servings && m.servings > 0) ? m.servings : 1;
      const curServings = state.detailServings || baseServings;
      const scale = curServings / baseServings;
      const rows = (m.ingredients || []).map(ing => `
        <tr>
          <td>${ing.amount !== '' && ing.amount !== null && ing.amount !== undefined ? fmtAmt(Number(ing.amount) * scale) : ''}</td>
          <td>${escapeHtml(ing.unit || '')}</td>
          <td>${escapeHtml(ing.name || '')}</td>
        </tr>`).join('');
      return `
        <div class="rb-overlay" id="rbOverlay">
          <div class="rb-sheet">
            <div class="rb-sheet-head">
              <p class="rb-sheet-title">&nbsp;</p>
              <button class="rb-close" id="rbDetailClose">${ICONS.close}</button>
            </div>
            ${photo}
            <div class="rb-detail-name-row">
              <p class="rb-detail-name">${escapeHtml(m.name)}</p>
              ${!m.photo ? `<button class="rb-heart rb-heart-detail ${m.liked ? 'liked' : ''}" data-heart="${m.id}" style="position:static;">${m.liked ? ICONS.heartFilled : ICONS.heartOutline}</button>` : ''}
            </div>
            <p class="rb-detail-source">${sourceLine}</p>
            <div class="rb-detail-tags">${timeChip}${tags}</div>

            <div class="rb-detail-section-label">Portionen</div>
            <div class="rb-servings-row">
              <div class="rb-stepper">
                <button id="rbServMinus">−</button>
                <span class="rb-stepper-val" id="rbServVal">${curServings}</span>
                <button id="rbServPlus">+</button>
              </div>
            </div>

            <div class="rb-detail-section-label">Zutaten</div>
            <table class="rb-ing-table">
              <thead><tr><th>Menge</th><th>Einheit</th><th>Zutat</th></tr></thead>
              <tbody>${rows || '<tr><td colspan="3">—</td></tr>'}</tbody>
            </table>

            <div class="rb-detail-section-label">Zubereitung</div>
            <div class="rb-detail-instructions">${escapeHtml(m.instructions || '')}</div>

            <button class="rb-edit-btn" id="rbEditBtn">Rezept bearbeiten</button>
            <button class="rb-delete-btn" id="rbDeleteBtn">Dieses Rezept löschen</button>
          </div>
        </div>`;
    }

    function bindDetailSheet(id) {
      document.getElementById('rbOverlay').addEventListener('click', e => { if (e.target.id === 'rbOverlay') closeOverlay(); });
      document.getElementById('rbDetailClose').addEventListener('click', closeOverlay);

      document.getElementById('rbDeleteBtn').addEventListener('click', async () => {
        if (!confirm('Dieses Rezept endgültig löschen? Es verschwindet für euch beide.')) return;
        try { await deleteRecipe(id); closeOverlay(); }
        catch (e) { alert('Löschen fehlgeschlagen. Bitte erneut versuchen.'); }
      });

      document.getElementById('rbEditBtn').addEventListener('click', () => {
        const m = getMeals().find(x => x.id === id);
        if (!m) return;
        state.addDraft = {
          id: m.id,
          name: m.name || '',
          instructions: m.instructions || '',
          sourceType: m.sourceType || 'cookbook',
          sourceDetail: m.sourceDetail || '',
          categories: [...(m.categories || [])],
          prepTime: m.prepTime || '',
          servings: m.servings || 4,
          ingredients: (m.ingredients && m.ingredients.length > 0) ? JSON.parse(JSON.stringify(m.ingredients)) : [{ amount: '', unit: 'g', name: '' }],
          photo: m.photo || null,
          saving: false, error: null, scanning: false, scanError: null, scanSuccess: false,
          dateAdded: m.dateAdded || Date.now()
        };
        state.overlay = 'add';
        renderOverlay();
      });

      document.getElementById('rbServMinus').addEventListener('click', () => {
        state.detailServings = Math.max(1, (state.detailServings || 1) - 1);
        renderOverlay();
      });
      document.getElementById('rbServPlus').addEventListener('click', () => {
        state.detailServings = (state.detailServings || 1) + 1;
        renderOverlay();
      });
      document.querySelectorAll('#rbOverlay [data-heart]').forEach(el => {
        el.addEventListener('click', () => { toggleLike(el.getAttribute('data-heart')); renderOverlay(); renderBody(); });
      });
    }

    function addSheetHtml() {
      const d = state.addDraft;
      const ingRows = d.ingredients.map((ing, i) => `
        <div class="rb-ing-row" data-idx="${i}">
          <input class="rb-input rb-ing-amount" type="text" inputmode="decimal" pattern="[0-9.,]*" placeholder="Menge" value="${ing.amount}">
          <select class="rb-input rb-ing-unit">${UNITS.map(u => `<option value="${u}" ${ing.unit === u ? 'selected' : ''}>${u}</option>`).join('')}</select>
          <input class="rb-input rb-ing-name" placeholder="Zutat" value="${escapeHtml(ing.name)}">
          <button class="rb-ing-remove" data-idx="${i}">×</button>
        </div>`).join('');
      return `
        <div class="rb-overlay" id="rbOverlay">
          <div class="rb-sheet">
            <div class="rb-sheet-head">
              <p class="rb-sheet-title">${d.id ? 'Rezept bearbeiten' : 'Neues Gericht'}</p>
              <button class="rb-close" id="rbAddClose">${ICONS.close}</button>
            </div>

            <button class="rb-scan-btn" id="rbScanBtn" ${d.scanning ? 'disabled' : ''}>${d.scanning ? ICONS.search + ' Rezept wird erkannt…' : ICONS.camera + ' Rezept aus Foto einlesen'}</button>
            <input type="file" accept="image/*" id="rbScanInput" style="display:none">
            ${d.scanError ? `<p class="rb-scan-error">${escapeHtml(d.scanError)}</p>` : ''}
            ${d.scanSuccess ? `<p class="rb-scan-status">✓ Felder ausgefüllt — bitte kurz prüfen.</p>` : ''}

            <div class="rb-field">
              <label class="rb-label">Foto vom Gericht</label>
              <div class="rb-photo-well" id="rbPhotoWell">${d.photo ? `<img src="${d.photo}" alt="">` : 'Zum Hinzufügen eines Fotos tippen'}</div>
              <input type="file" accept="image/*" id="rbPhotoInput" style="display:none">
            </div>

            <div class="rb-field">
              <label class="rb-label">Name des Gerichts</label>
              <input class="rb-input" id="rbNameInput" placeholder="z. B. Omas Lasagne" value="${escapeHtml(d.name)}">
            </div>

            <div class="rb-field">
              <label class="rb-label">Quelle</label>
              <div class="rb-source-row" id="rbSourceRow">
                ${SOURCE_TYPES.map(s => `<div class="rb-source-btn ${d.sourceType === s.key ? 'active' : ''}" data-key="${s.key}">${s.label}</div>`).join('')}
              </div>
              <input class="rb-input" id="rbSourceDetail" placeholder="${SOURCE_TYPES.find(s=>s.key===d.sourceType).placeholder}" value="${escapeHtml(d.sourceDetail)}">
            </div>

            <div class="rb-field">
              <label class="rb-label">Zubereitungszeit</label>
              <div class="rb-time-row" id="rbTimeRow">
                ${TIME_PRESETS.map(t => `<div class="rb-time-chip ${d.prepTime === t ? 'active' : ''}" data-time="${t}">${t}</div>`).join('')}
              </div>
              <input class="rb-input" id="rbPrepInput" placeholder="z. B. 30 Min." value="${escapeHtml(d.prepTime)}">
            </div>

            <div class="rb-field">
              <label class="rb-label">Kategorien</label>
              <div class="rb-cat-row" id="rbCatRow">
                ${Array.from(new Set([...SUGGESTED_CATEGORIES, ...allCategories(), ...d.categories])).map(c => `<div class="rb-cat-chip ${d.categories.includes(c) ? 'selected' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join('')}
              </div>
              <div class="rb-cat-add-row">
                <input class="rb-input" id="rbCatCustom" placeholder="Eigenen Tag hinzufügen">
                <button class="rb-small-btn" id="rbCatAddBtn">Hinzufügen</button>
              </div>
            </div>

            <div class="rb-field">
              <label class="rb-label">Portionen (Personen)</label>
              <input class="rb-input" id="rbServingsInput" type="number" min="1" step="1" value="${d.servings}">
            </div>

            <div class="rb-field">
              <label class="rb-label">Zutaten</label>
              <div id="rbIngRows">${ingRows}</div>
              <button class="rb-small-btn rb-ing-add-btn" id="rbIngAddBtn">+ Zutat</button>
            </div>

            <div class="rb-field">
              <label class="rb-label">Zubereitung</label>
              <textarea class="rb-textarea" id="rbInstructionsInput" placeholder="Schritte, Hinweise…">${escapeHtml(d.instructions)}</textarea>
            </div>

            ${d.error ? `<div class="rb-error">${escapeHtml(d.error)}</div>` : ''}
            <button class="rb-save-btn" id="rbSaveBtn" ${d.saving ? 'disabled' : ''}>${d.saving ? 'Wird gespeichert…' : (d.id ? 'Änderungen speichern' : 'Gericht speichern')}</button>
          </div>
        </div>`;
    }

    function bindAddSheet() {
      const d = state.addDraft;
      document.getElementById('rbOverlay').addEventListener('click', e => { if (e.target.id === 'rbOverlay') closeOverlay(); });
      document.getElementById('rbAddClose').addEventListener('click', closeOverlay);

      document.getElementById('rbNameInput').addEventListener('input', e => { d.name = e.target.value; });
      document.getElementById('rbInstructionsInput').addEventListener('input', e => { d.instructions = e.target.value; });
      document.getElementById('rbSourceDetail').addEventListener('input', e => { d.sourceDetail = e.target.value; });
      document.getElementById('rbPrepInput').addEventListener('input', e => { d.prepTime = e.target.value; });
      document.getElementById('rbServingsInput').addEventListener('input', e => { d.servings = e.target.value; });

      document.getElementById('rbSourceRow').querySelectorAll('.rb-source-btn').forEach(el => {
        el.addEventListener('click', () => {
          d.sourceType = el.getAttribute('data-key');
          document.getElementById('rbSourceRow').querySelectorAll('.rb-source-btn').forEach(b => b.classList.toggle('active', b === el));
          const detailInput = document.getElementById('rbSourceDetail');
          const meta = SOURCE_TYPES.find(s => s.key === d.sourceType);
          if (detailInput && meta) detailInput.placeholder = meta.placeholder;
        });
      });
      document.getElementById('rbTimeRow').querySelectorAll('.rb-time-chip').forEach(el => {
        el.addEventListener('click', () => {
          d.prepTime = el.getAttribute('data-time');
          document.getElementById('rbTimeRow').querySelectorAll('.rb-time-chip').forEach(b => b.classList.toggle('active', b === el));
          const prepInput = document.getElementById('rbPrepInput');
          if (prepInput) prepInput.value = d.prepTime;
        });
      });
      function bindCatChip(el) {
        el.addEventListener('click', () => {
          const c = el.getAttribute('data-cat');
          const idx = d.categories.indexOf(c);
          if (idx >= 0) { d.categories.splice(idx, 1); el.classList.remove('selected'); }
          else { d.categories.push(c); el.classList.add('selected'); }
        });
      }
      document.getElementById('rbCatRow').querySelectorAll('.rb-cat-chip').forEach(bindCatChip);

      document.getElementById('rbCatAddBtn').addEventListener('click', () => {
        const input = document.getElementById('rbCatCustom');
        const val = input.value.trim();
        if (!val) return;
        input.value = '';
        const catRow = document.getElementById('rbCatRow');
        const already = catRow.querySelector(`.rb-cat-chip[data-cat="${CSS.escape(val)}"]`);
        if (already) {
          if (!d.categories.includes(val)) { d.categories.push(val); already.classList.add('selected'); }
          return;
        }
        if (!d.categories.includes(val)) d.categories.push(val);
        const chip = document.createElement('div');
        chip.className = 'rb-cat-chip selected';
        chip.setAttribute('data-cat', val);
        chip.textContent = val;
        bindCatChip(chip);
        catRow.appendChild(chip);
      });

      document.getElementById('rbIngRows').querySelectorAll('.rb-ing-row').forEach(row => {
        const i = Number(row.getAttribute('data-idx'));
        row.querySelector('.rb-ing-amount').addEventListener('input', e => { d.ingredients[i].amount = e.target.value; });
        row.querySelector('.rb-ing-unit').addEventListener('change', e => { d.ingredients[i].unit = e.target.value; });
        row.querySelector('.rb-ing-name').addEventListener('input', e => { d.ingredients[i].name = e.target.value; });
        row.querySelector('.rb-ing-remove').addEventListener('click', () => { d.ingredients.splice(i, 1); withPreservedScroll(renderOverlay); });
      });
      if (d._focusLastIngredient) {
        d._focusLastIngredient = false;
        const rows = document.querySelectorAll('#rbIngRows .rb-ing-row');
        const lastRow = rows[rows.length - 1];
        const amountInput = lastRow ? lastRow.querySelector('.rb-ing-amount') : null;
        if (amountInput) amountInput.focus();
      }
      document.getElementById('rbIngAddBtn').addEventListener('click', () => {
        d.ingredients.push({ amount: '', unit: 'g', name: '' });
        d._focusLastIngredient = true;
        withPreservedScroll(renderOverlay);
      });

      const photoWell = document.getElementById('rbPhotoWell');
      const photoInput = document.getElementById('rbPhotoInput');
      photoWell.addEventListener('click', () => photoInput.click());
      photoInput.addEventListener('change', async () => {
        const file = photoInput.files[0];
        if (!file) return;
        try { d.photo = await resizeImage(file, 800, 0.68); renderOverlay(); }
        catch (e) { d.error = 'Dieses Foto konnte nicht gelesen werden. Versuch ein anderes.'; renderOverlay(); }
      });

      const scanBtn = document.getElementById('rbScanBtn');
      const scanInput = document.getElementById('rbScanInput');
      scanBtn.addEventListener('click', () => scanInput.click());
      scanInput.addEventListener('change', async () => {
        const file = scanInput.files[0];
        if (!file) return;
        d.scanning = true; d.scanError = null; d.scanSuccess = false;
        renderOverlay();
        try {
          const dataUrl = await resizeImage(file, 1600, 0.85);
          const base64 = dataUrl.split(',')[1];
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-6',
              max_tokens: 1500,
              messages: [{
                role: 'user',
                content: [
                  { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
                  { type: 'text', text: 'Extrahiere aus diesem Rezeptfoto (Kochbuchseite, handschriftliche Notiz oder Screenshot) folgende Angaben. Antworte AUSSCHLIESSLICH mit einem reinen JSON-Objekt, ohne Markdown-Codeblock, ohne jeglichen weiteren Text, auf Deutsch:\n{"name": "Name des Gerichts", "servings": Zahl, "prepTime": "z.B. 30 Min. oder leerer String", "ingredients": [{"amount": Zahl oder null, "unit": "g|kg|ml|l|TL|EL|Tasse|Stk.|Prise|oz|lb|Zehe|Scheibe|Dose|Bund|sonst.", "name": "Zutat"}], "instructions": "Fließtext der Zubereitungsschritte"}\nWenn eine Angabe nicht erkennbar ist, nutze sinnvolle Standardwerte (servings: 4) oder leere Strings/Arrays.' }
                ]
              }]
            })
          });
          const data = await response.json();
          const text = (data.content || []).map(b => b.text || '').join('');
          const clean = text.replace(/```json|```/g, '').trim();
          const parsed = JSON.parse(clean);
          if (parsed.name) d.name = parsed.name;
          if (parsed.servings) d.servings = parsed.servings;
          if (parsed.prepTime) d.prepTime = parsed.prepTime;
          if (parsed.instructions) d.instructions = parsed.instructions;
          if (Array.isArray(parsed.ingredients) && parsed.ingredients.length > 0) {
            d.ingredients = parsed.ingredients.map(ing => ({
              amount: (ing.amount === null || ing.amount === undefined || ing.amount === '') ? '' : String(ing.amount),
              unit: matchUnit(ing.unit),
              name: ing.name || ''
            }));
          }
          d.scanning = false;
          d.scanSuccess = true;
          renderOverlay();
        } catch (e) {
          d.scanning = false;
          d.scanError = 'Das Rezept konnte nicht automatisch erkannt werden. Bitte manuell eintragen oder ein anderes Foto versuchen.';
          renderOverlay();
        }
      });

      document.getElementById('rbSaveBtn').addEventListener('click', async () => {
        if (!d.name.trim()) { d.error = 'Bitte gib dem Gericht zuerst einen Namen.'; renderOverlay(); return; }
        d.error = null;
        d.saving = true;
        renderOverlay();
        const entry = {
          id: d.id || newId(),
          name: d.name.trim(),
          instructions: d.instructions.trim(),
          sourceType: d.sourceType,
          sourceDetail: d.sourceDetail.trim(),
          categories: d.categories,
          prepTime: d.prepTime.trim(),
          servings: Number(d.servings) || 1,
          ingredients: d.ingredients.filter(ing => ing.name && ing.name.trim()).map(ing => ({ amount: ing.amount === '' ? null : Number(ing.amount), unit: ing.unit, name: ing.name.trim() })),
          photo: d.photo,
          addedBy: state.user.uid,
          addedByName: state.user.displayName || state.user.email || '',
          dateAdded: d.dateAdded || Date.now()
        };
        try { await saveRecipe(entry); closeOverlay(); }
        catch (e) { d.saving = false; d.error = 'Konnte nicht gespeichert werden. Prüfe deine Verbindung und versuch es erneut.'; renderOverlay(); }
      });
    }

    function resizeImage(file, maxDim, quality) {
      maxDim = maxDim || 800; quality = quality || 0.68;
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > h) { if (w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; } }
            else { if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; } }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('bad image'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('read error'));
        reader.readAsDataURL(file);
      });
    }

    render();
  </script>
</body>
</html>
